name: Build and Release

# Push a vX.Y.Z tag: the tests run on every platform, then the binaries for Windows,
# Linux and macOS (Intel and Apple Silicon) are built on stable Rust and attached to the
# GitHub release. Running the workflow by hand tests and builds without releasing.
#
# evidencefs and dirtyhive are path dependencies (../evidencefs, ../dirtyhive): they are
# checked out beside this repository at the refs below. Move a ref when the tool needs a
# newer library.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  EVIDENCEFS_REF: v0.1.0

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            test: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            test: true
          - target: x86_64-apple-darwin
            # macos-latest is Apple Silicon; it cross-compiles to Intel (the Intel
            # runners queue for hours on the free tier). Tested as arm64 below.
            os: macos-latest
            mac_arch: x86_64
            test: false
          - target: aarch64-apple-darwin
            os: macos-latest
            mac_arch: arm64
            test: true

    steps:
      - uses: actions/checkout@v4
        with:
          path: etcdump

      - uses: actions/checkout@v4
        with:
          repository: jupyterj0nes/evidencefs
          ref: ${{ env.EVIDENCEFS_REF }}
          path: evidencefs

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        if: matrix.test
        working-directory: etcdump
        run: cargo test --release --locked

      - name: Build release
        working-directory: etcdump
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp etcdump/target/${{ matrix.target }}/release/etcdump.exe etcdump-${{ github.ref_name }}-windows.exe

      - name: Rename binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp etcdump/target/${{ matrix.target }}/release/etcdump etcdump-${{ github.ref_name }}-linux
          chmod +x etcdump-${{ github.ref_name }}-linux

      - name: Rename binary (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          cp etcdump/target/${{ matrix.target }}/release/etcdump etcdump-${{ github.ref_name }}-macos-${{ matrix.mac_arch }}
          chmod +x etcdump-${{ github.ref_name }}-macos-${{ matrix.mac_arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: etcdump-${{ matrix.target }}
          path: etcdump-${{ github.ref_name }}*

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List files
        run: ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: etcdump-*
